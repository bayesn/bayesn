[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bayesn*"]

[project]
name = "bayesn"
version = "1.0.0"
requires-python = ">= 3.10"
dependencies = [
    "arviz >= 0.0.1",
    "astropy >= 6.0.0",
    "h5py >= 3.6.0",
    "jax >= 0.4.27, <=0.6.0",
    "jaxlib >= 0.4.27, <=0.6.0",
    "matplotlib >= 3.5",
    "numpy >= 1.23.5",
    "numpyro >= 0.14.0",
    "pandas >= 1.4.0",
    "ruamel.yaml >= 0.16.0",
    "sfdmap2 >= 0.2.1",
    "scipy >= 1.15.0",
    "sncosmo >= 2.10",
    "tqdm >= 4.29.1"
]
authors = [
    {name = "Matthew Grayling", email = "mg2102@cam.ac.uk"},
    {name = "Stephen Thorp"},
    {name = "Kaisey Mandel"},
    {name = "Aaron Do", email = "ajmd6@cam.ac.uk"},
    {name = "Madeleine Ginolin"},
]
description = "Hierarchical Bayesian modelling of type Ia SNe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
run_bayesn = "bayesn.run_bayesn:main"

[project.urls]
Homepage = "https://github.com/bayesn/bayesn"
Documentation = "https://bayesn.readthedocs.io/en/latest/"

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-cov",
    "dust_extinction >= 1.6",
    "extinction >= 0.4.6",
]
build-docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "pillow",
    "numpydoc",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow' --cov=bayesn --cov-report=term-missing"
markers = [
    "slow: Deep integration or long-running tests (run with -m slow)",
]
testpaths = "tests"

